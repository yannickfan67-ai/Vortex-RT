name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-lavapipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan + Lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-tools glslc curl

      - name: Select Lavapipe ICD
        run: |
          echo "Installed ICDs:"
          find /usr/share/vulkan/icd.d -maxdepth 1 -type f -print || true
          LVP="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f \( -iname '*lvp*.json' -o -iname '*lavapipe*.json' \) | head -n 1)"
          test -n "$LVP"
          echo "Using Lavapipe ICD: $LVP"
          echo "VK_ICD_FILENAMES=$LVP" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$LVP" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build -j2

      - name: Verify CPU Vulkan driver
        run: vulkaninfo --summary

      - name: Run Vulkan smoke tests
        run: ctest --test-dir build --output-on-failure

      - name: Download Gemma 3 270M Q8_0
        run: |
          curl -L --fail --retry 3 --retry-delay 2             -o gemma-3-270m-Q8_0.gguf             "https://huggingface.co/ggml-org/gemma-3-270m-GGUF/resolve/main/gemma-3-270m-Q8_0.gguf?download=true"
          echo "e00cf79514204dfe2f4d6943f277ffea7fd8a4c8e955b4b7a869cfc157694881  gemma-3-270m-Q8_0.gguf" | sha256sum -c -

      - name: Parse and validate GGUF
        run: |
          ./build/vortexrt-gguf-info gemma-3-270m-Q8_0.gguf --expect-arch gemma3 | tee gguf-report.txt
          grep -q "Tokenizer tokens readable:" gguf-report.txt
          grep -q "Validation: OK" gguf-report.txt

      - name: Generate text with Gemma on Lavapipe
        run: |
          ./build/vortexrt-gemma             --model gemma-3-270m-Q8_0.gguf             --prompt "The capital of France is"             --tokens 3 | tee generation-report.txt
          grep -q "Generated continuation:" generation-report.txt
          grep -q "Generation: OK" generation-report.txt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortexrt-reports
          path: |
            gguf-report.txt
            generation-report.txt
          if-no-files-found: ignore

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-lavapipe:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan + Lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-tools glslc curl

      - name: Locate Lavapipe ICD
        shell: bash
        run: |
          set -euo pipefail
          echo "Available Vulkan ICD manifests:"
          find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -maxdepth 1 -type f -name '*.json' -print 2>/dev/null || true

          LVP_ICD="$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -maxdepth 1 -type f \( -iname '*lvp*.json' -o -iname '*lavapipe*.json' \) -print 2>/dev/null | head -n 1)"
          if [ -z "$LVP_ICD" ]; then
            echo "Lavapipe ICD manifest was not found. Files from mesa-vulkan-drivers:"
            dpkg -L mesa-vulkan-drivers | grep -Ei 'vulkan|icd|lvp|lavapipe' || true
            exit 1
          fi

          echo "Using Lavapipe ICD: $LVP_ICD"
          echo "VK_DRIVER_FILES=$LVP_ICD" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build -j2

      - name: Verify CPU Vulkan driver
        run: vulkaninfo --summary

      - name: Run Vulkan smoke tests
        run: |
          ./build/vortexrt-info
          ./build/vortexrt-bench --elements 65536 --repetitions 2
          ./build/vortexrt-q8-test
          ./build/vortexrt-gelu-test
          ./build/vortexrt-ffn-test
          ctest --test-dir build --output-on-failure

      - name: Cache Gemma 3 270M Q8_0
        id: gemma-cache
        uses: actions/cache@v4
        with:
          path: gemma-3-270m-Q8_0.gguf
          key: gemma-3-270m-q8-0-e00cf79514204dfe

      - name: Download Gemma 3 270M Q8_0
        if: steps.gemma-cache.outputs.cache-hit != 'true'
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            -o gemma-3-270m-Q8_0.gguf \
            "https://huggingface.co/ggml-org/gemma-3-270m-GGUF/resolve/main/gemma-3-270m-Q8_0.gguf?download=true"

      - name: Verify Gemma checksum
        run: |
          echo "e00cf79514204dfe2f4d6943f277ffea7fd8a4c8e955b4b7a869cfc157694881  gemma-3-270m-Q8_0.gguf" | sha256sum -c -

      - name: Parse and validate GGUF
        run: |
          ./build/vortexrt-gguf-info gemma-3-270m-Q8_0.gguf --expect-arch gemma3 | tee gguf-report.txt
          grep -q "Tokenizer tokens readable:" gguf-report.txt
          grep -q "Validation: OK" gguf-report.txt

      - name: Run real Gemma 3 forward and LM head
        run: |
          ./build/vortexrt-gemma gemma-3-270m-Q8_0.gguf --token-id 2 --top-k 8 | tee gemma-forward-report.txt
          grep -q "Layers: 18" gemma-forward-report.txt
          grep -q "Final hidden checksum:" gemma-forward-report.txt
          grep -q "Top logits:" gemma-forward-report.txt
          grep -q "Validation: OK" gemma-forward-report.txt

      - name: Generate real Gemma 3 text with KV cache
        run: |
          ./build/vortexrt-gemma gemma-3-270m-Q8_0.gguf --generate 4 | tee gemma-generation-report.txt
          grep -q "Generated token ids:" gemma-generation-report.txt
          grep -q "TEXT_BEGIN" gemma-generation-report.txt
          grep -q "TEXT_END" gemma-generation-report.txt
          grep -q "Validation: OK" gemma-generation-report.txt

      - name: Run prompted Gemma 3 generation
        run: |
          ./build/vortexrt-gemma gemma-3-270m-Q8_0.gguf --prompt "Hello" --generate 2 | tee gemma-prompt-report.txt
          grep -q "Prompt token ids:" gemma-prompt-report.txt
          grep -q "Generated token ids:" gemma-prompt-report.txt
          grep -q "TEXT_BEGIN" gemma-prompt-report.txt
          grep -q "Validation: OK" gemma-prompt-report.txt

      - name: Benchmark Q8 lane and fusion policies
        run: |
          set -euo pipefail
          for lanes in 64 32 16 8; do
            ./build/vortexrt-gemma gemma-3-270m-Q8_0.gguf \
              --q8-lanes "$lanes" \
              --projection-fusion off \
              --generate 4 \
              | tee "gemma-q8-${lanes}-report.txt"
            grep -q "Validation: OK" "gemma-q8-${lanes}-report.txt"
          done

          ./build/vortexrt-gemma gemma-3-270m-Q8_0.gguf \
            --q8-lanes 8 \
            --projection-fusion on \
            --generate 4 \
            | tee gemma-q8-8-fused-report.txt
          grep -q "Validation: OK" gemma-q8-8-fused-report.txt
          grep -q "Fused FFN: enabled" gemma-q8-8-fused-report.txt

      - name: Upload model reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma-reports
          path: |
            gguf-report.txt
            gemma-forward-report.txt
            gemma-generation-report.txt
            gemma-prompt-report.txt
            gemma-q8-*-report.txt
          if-no-files-found: ignore
